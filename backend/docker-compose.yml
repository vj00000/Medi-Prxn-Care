name: smart-rx

services:
  db:
    # Reuses the postgres:17-alpine image already present on this machine.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smartrx
      POSTGRES_PASSWORD: smartrx
      POSTGRES_DB: smartrx
    # Host 5432 is taken by another container, so publish on 5433.
    ports:
      - "5433:5432"
    volumes:
      - smart_rx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrx -d smartrx"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://smartrx:smartrx@db:5432/smartrx
      # Read from backend/.env (compose auto-loads it); empty if unset.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smart_rx_pgdata:
